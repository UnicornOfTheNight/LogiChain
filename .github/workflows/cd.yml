name: CD - Deploiement production

on:
  push:
    branches: [main]
    paths:
      - "logichain-api/**"
      - "ansible/**"
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deployer sur le VPS
    # Runner self-hoste, installe directement sur le VPS cible : les
    # runners GitHub-hoste (IP Azure) sont filtres par la protection
    # reseau de l'hebergeur avant meme d'atteindre le port SSH. Le runner
    # self-hoste execute Ansible en local, sans traverser Internet.
    # Securite : ce workflow ne se declenche que sur push vers main ou
    # workflow_dispatch (jamais sur pull_request), donc uniquement pour
    # les personnes ayant deja un acces en ecriture au depot.
    runs-on: [self-hosted, production]
    # Environnement protege (Settings -> Environments -> production, avec
    # "Required reviewers") : le job automatique se declenche bien sur push
    # vers main, mais reste en attente d'une validation manuelle explicite
    # avant de s'executer -> deploiement "sur validation" comme demande.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Installer les collections Ansible requises
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Preparer le mot de passe du vault Ansible
        run: printf '%s' "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > "$RUNNER_TEMP/vault_pass.txt"

      - name: Deployer via Ansible (playbook complet, idempotent, connexion locale)
        working-directory: ansible
        run: |
          ansible-playbook site.yml \
            -i inventory/production-local.ini \
            --vault-password-file "$RUNNER_TEMP/vault_pass.txt"

      - name: Nettoyer les fichiers sensibles
        if: always()
        run: rm -f "$RUNNER_TEMP/vault_pass.txt"
