name: CD - Deploiement production

on:
  push:
    branches: [main]
    paths:
      - "logichain-api/**"
      - "ansible/**"
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deployer sur le VPS
    runs-on: ubuntu-latest
    # Environnement protege (Settings -> Environments -> production, avec
    # "Required reviewers") : le job automatique se declenche bien sur push
    # vers main, mais reste en attente d'une validation manuelle explicite
    # avant de s'executer -> deploiement "sur validation" comme demande.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Ansible et les collections requises
        run: |
          pip install --quiet ansible
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Configurer la cle SSH de deploiement
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 187.127.84.96 >> ~/.ssh/known_hosts

      - name: Preparer le mot de passe du vault Ansible
        run: printf '%s' "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > "$RUNNER_TEMP/vault_pass.txt"

      - name: Deployer via Ansible (playbook complet, idempotent)
        working-directory: ansible
        run: |
          ansible-playbook site.yml \
            -i inventory/production.ini \
            --private-key ~/.ssh/deploy_key \
            --vault-password-file "$RUNNER_TEMP/vault_pass.txt"

      - name: Nettoyer les fichiers sensibles
        if: always()
        run: rm -f ~/.ssh/deploy_key "$RUNNER_TEMP/vault_pass.txt"
