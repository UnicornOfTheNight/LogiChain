---
# --- Installation de Node.js (dépôt officiel NodeSource, 100% modules natifs) ---

- name: Créer le répertoire des clés APT
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true

- name: Ajouter la clé GPG NodeSource
  ansible.builtin.get_url:
    url: "https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key"
    dest: /etc/apt/keyrings/nodesource.asc
    mode: "0644"
  become: true

- name: Ajouter le dépôt APT NodeSource
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_{{ node_major_version }}.x nodistro main"
    state: present
    filename: nodesource
  become: true

- name: Installer Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true
  become: true

- name: Installer PM2 globalement (utilisé en mode pm2-runtime, supervisé par systemd)
  community.general.npm:
    name: pm2
    global: true
    state: present
  become: true

# --- Déploiement de l'application ---
# Note : ces tâches s'exécutent en root (pas de become_user vers le compte
# de service) puis rechownent le résultat à la fin. Utiliser become_user ici
# déclenche un bug connu d'Ansible (partage des fichiers temporaires par ACL
# entre l'utilisateur de connexion et l'utilisateur cible), qui échoue sur ce
# système ("chmod: invalid mode: 'A+user:...:allow'"). Conséquence : le
# dépôt appartient à "logichain" alors que git tourne en root -> il faut
# explicitement déclarer ce répertoire comme sûr ("dubious ownership").

- name: Autoriser Git à opérer sur le dépôt malgré le changement de propriétaire
  community.general.git_config:
    name: safe.directory
    scope: global
    value: "{{ service_user_home }}/app"
  become: true

- name: Cloner/mettre à jour le dépôt LogiChain
  ansible.builtin.git:
    repo: "{{ logichain_repo }}"
    dest: "{{ service_user_home }}/app"
    version: "{{ logichain_version }}"
  become: true
  notify: Redémarrer logichain-api

- name: Déployer le fichier .env de production (secrets injectés via Ansible Vault)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ service_user_home }}/app/logichain-api/.env"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: "0600"
  become: true
  notify: Redémarrer logichain-api

- name: Installer les dépendances de production (npm ci)
  community.general.npm:
    path: "{{ service_user_home }}/app/logichain-api"
    ci: true
    production: true
  become: true
  notify: Redémarrer logichain-api

- name: Donner la propriété de l'application à l'utilisateur de service
  ansible.builtin.file:
    path: "{{ service_user_home }}/app"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    recurse: true
  become: true

# --- Supervision via systemd + pm2-runtime ---
# pm2-runtime tourne au premier plan (pas de démon PM2 séparé à "resurrect") :
# c'est systemd qui supervise le processus (redémarrage auto, boot, logs
# journalctl). Choix motivé par la contrainte d'idempotence stricte du
# cahier des charges : `ansible.builtin.systemd` est 100% déclaratif et
# natif, contrairement aux commandes `pm2 start/save/resurrect` classiques.

- name: Déployer le service systemd de l'API LogiChain
  ansible.builtin.template:
    src: logichain-api.service.j2
    dest: /etc/systemd/system/logichain-api.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Redémarrer logichain-api

- name: Recharger systemd, activer et démarrer le service
  ansible.builtin.systemd:
    daemon_reload: true
    name: logichain-api
    enabled: true
    state: started
  become: true
