---
- name: Mettre à jour le cache et appliquer les mises à jour de sécurité (safe, pas dist-upgrade)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: safe
  become: true

- name: Installer les paquets de base
  ansible.builtin.apt:
    name:
      - ufw
      - fail2ban
      - unattended-upgrades
    state: present
  become: true

- name: Créer l'utilisateur de service non-root pour l'application LogiChain
  ansible.builtin.user:
    name: "{{ service_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ service_user_home }}"
    create_home: true
    comment: "Compte de service LogiChain API (non interactif)"
  become: true

# --- Pare-feu UFW ---
# Ce VPS héberge aussi le projet Dromozic : on n'utilise jamais `ufw reset`
# ni ne touche aux règles existantes. On ajoute uniquement ce dont LogiChain
# a besoin (additif, idempotent).

- name: Autoriser SSH (rule=limit -> anti-bruteforce natif ufw, complète Fail2Ban)
  community.general.ufw:
    rule: limit
    port: "{{ ssh_port }}"
    proto: tcp
  become: true

- name: Autoriser le port HTTP temporaire de LogiChain (en attendant un nom de domaine)
  community.general.ufw:
    rule: allow
    port: "{{ nginx_listen_port }}"
    proto: tcp
  become: true

- name: Autoriser HTTP/HTTPS (une fois le domaine + Let's Encrypt en place)
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: [80, 443]
  when: enable_ssl | bool
  become: true

- name: Définir la politique par défaut (deny incoming / allow outgoing)
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }
  become: true

- name: Activer UFW
  community.general.ufw:
    state: enabled
  become: true

# --- Durcissement SSH ---
# Pré-requis : l'accès par clé SSH doit déjà fonctionner (c'est le cas ici).
# Recommandé : garder une session SSH ouverte en parallèle lors du premier
# lancement du playbook, par sécurité.

- name: Durcir la configuration SSH
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    validate: "/usr/sbin/sshd -t -f %s"
  # Pas d'espace/indentation autorisée entre "#" et le nom de la directive :
  # exclut les lignes de commentaire prosaïques ("# PasswordAuthentication.
  # Depending on...") et les exemples indentés sous un bloc "Match" (ex:
  # "#      X11Forwarding no"), qui ne sont pas de vraies directives.
  loop:
    - { regexp: "^#?PermitRootLogin\\b", line: "PermitRootLogin no" }
    - { regexp: "^#?PasswordAuthentication\\b", line: "PasswordAuthentication no" }
    - { regexp: "^#?X11Forwarding\\b", line: "X11Forwarding no" }
    - { regexp: "^#?MaxAuthTries\\b", line: "MaxAuthTries 4" }
  become: true
  notify: Redémarrer sshd

# --- Fail2Ban ---
- name: Déployer la configuration Fail2Ban (jail sshd)
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Redémarrer fail2ban

- name: S'assurer que Fail2Ban est démarré et activé au boot
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: true
  become: true
